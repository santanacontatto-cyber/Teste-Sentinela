name: Publicar Presente do Guardião

on:
  push:
    branches: [main]
    paths:
      - "presente-guardiao-32/**"
      - ".github/workflows/presente-guardiao-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-presente-guardiao"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empacotar presente
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./presente-guardiao-32
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
